<section id="quotes" class="quotes-section fade-up-section" appScrollReveal="is-visible">
  <div class="quotes-inner">
    <p class="section-label">{{ content.label }}</p>
    <h2 class="section-title">{{ content.title }}</h2>
    <div class="ornament"><div class="ornament-line"></div><div class="ornament-diamond"></div><div class="ornament-line"></div></div>
      @for (quote of content.quotes; track quote.text) {
      <blockquote class="pull-quote">
        <p>{{ quote.text }}</p>
        <cite>{{ quote.cite }}</cite>
      </blockquote>
      }
  </div>
</section>
